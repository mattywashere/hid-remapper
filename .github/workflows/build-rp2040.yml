# Feather RP2040 USB Host only. Replaces the multi-board build on this fork.
name: build-rp2040

on:
  push:
    branches:
      - feather-two-hubs
    paths:
      - 'firmware/**'
      - '.github/workflows/build-rp2040.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: feather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-feather:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out firmware and submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install ARM toolchain and Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            ninja-build \
            srecord

      - name: Apply TinyUSB hub diagnostics
        run: |
          git -C firmware/tinyusb -c core.autocrlf=true apply --check "$GITHUB_WORKSPACE/firmware/patches/tinyusb-hub-port-recovery.patch"
          git -C firmware/tinyusb -c core.autocrlf=true apply "$GITHUB_WORKSPACE/firmware/patches/tinyusb-hub-port-recovery.patch"
          git -C firmware/tinyusb -c core.autocrlf=true apply --check "$GITHUB_WORKSPACE/firmware/patches/tinyusb-hub-port-flags.patch"
          git -C firmware/tinyusb -c core.autocrlf=true apply "$GITHUB_WORKSPACE/firmware/patches/tinyusb-hub-port-flags.patch"
          git -C firmware/tinyusb -c core.autocrlf=true apply --check "$GITHUB_WORKSPACE/firmware/patches/tinyusb-hub-port-power-test.patch"
          git -C firmware/tinyusb -c core.autocrlf=true apply "$GITHUB_WORKSPACE/firmware/patches/tinyusb-hub-port-power-test.patch"

      - name: Configure Feather RP2040 USB Host
        run: cmake -S firmware -B firmware/build-feather -G Ninja -DPICO_BOARD=feather_host

      - name: Compile only remapper_feather
        run: cmake --build firmware/build-feather --target remapper --parallel 4

      - name: Prepare single UF2
        run: |
          mkdir -p firmware/artifacts
          cp firmware/build-feather/remapper.uf2 firmware/artifacts/remapper_feather.uf2

      - name: Upload remapper_feather.uf2 only
        uses: actions/upload-artifact@v7
        with:
          name: remapper_feather
          path: firmware/artifacts/remapper_feather.uf2
          if-no-files-found: error
          retention-days: 14
